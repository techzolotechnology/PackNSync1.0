# Render Blueprint — connect this repo in Render Dashboard → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: packandsync-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: packandsync-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: packandsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        value: https://pickandsync.com
      - key: FRONTEND_URLS
        value: https://pickandsync.com,https://www.pickandsync.com,https://techzolotechnology.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:19006,http://127.0.0.1:19006
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.zeptomail.in
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: emailapikey
      - key: SMTP_PASS
        sync: false
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: ZEPTOMAIL_SEND_TOKEN
        sync: false
      - key: EMAIL_PROVIDER
        value: zeptomail-api
      - key: ZEPTOMAIL_REGION
        value: in
      - key: ZEPTOMAIL_API_URL
        value: https://api.zeptomail.in/v1.1/email
      - key: EMAIL_FROM
        value: PickAndSync <noreply@pickandsync.com>
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: CASHFREE_PAYOUT_CLIENT_ID
        sync: false
      - key: CASHFREE_PAYOUT_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        value: https://api.pickandsync.com
      # Commission added on top of the host's price, and when host earnings release
      - key: PLATFORM_FEE_PERCENT
        value: "2"
      - key: HOST_EARNING_RELEASE_HOURS
        value: "24"
      # Referral reward (promo credit, INR) for both people; 0 disables
      - key: REFERRAL_REWARD_INR
        value: "100"
      # Most promo credit one admin offer may hand out in total (all recipients together)
      - key: OFFER_MAX_TOTAL_CREDIT_INR
        value: "200000"
      # Admin security: Google Authenticator is required for the admin panel
      - key: ADMIN_MFA_REQUIRED
        value: "true"
      - key: ADMIN_MFA_SESSION_HOURS
        value: "12"
      # Security / money alerts (admin sign-ins, payouts, refunds, role changes)
      - key: ADMIN_ALERT_EMAILS
        value: Kartikgauttam@techzolo.in
      # Encrypts admin authenticator secrets at rest (falls back to JWT_SECRET)
      - key: SECRET_BOX_KEY
        generateValue: true

databases:
  - name: packandsync-db
    plan: free
    databaseName: packandsync
    user: packandsync
