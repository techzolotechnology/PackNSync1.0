# Render Blueprint — connect this repo in Render Dashboard → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: packandsync-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: packandsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pickandsync.com
      - key: FRONTEND_URLS
        value: https://pickandsync.com,https://www.pickandsync.com,http://localhost:5173,http://127.0.0.1:5173
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.zeptomail.in
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: emailapikey
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: PackAndSync <noreply@pickandsync.com>

databases:
  - name: packandsync-db
    plan: free
    databaseName: packandsync
    user: packandsync
