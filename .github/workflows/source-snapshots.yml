name: Source snapshot releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Create a tagged GitHub release for this source push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="snapshot-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
