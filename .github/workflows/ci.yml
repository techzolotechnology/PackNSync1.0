# Continuous Integration — runs on every push & pull request
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Lint frontend
        run: npm run lint --workspace=frontend
        continue-on-error: true

      - name: Build frontend
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://api.pickandsync.com/api
          VITE_SOCKET_URL: https://api.pickandsync.com
          VITE_BASE: ./

      - name: Backend syntax check
        run: node --check backend/src/index.js

      - name: Backend tests
        run: npm test --workspace=backend

      - name: Host app lint and tests
        run: |
          npm run lint --workspace=apps/host-mobile
          npm test --workspace=apps/host-mobile

      - name: Host Android bundle
        run: npm run build:android:bundle --workspace=apps/host-mobile
