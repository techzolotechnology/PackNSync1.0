# Continuous Integration — runs on every push & pull request
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Lint frontend
        run: npm run lint --workspace=frontend
        continue-on-error: true

      - name: Build frontend
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://api.pickandsync.com/api
          VITE_SOCKET_URL: https://api.pickandsync.com
          VITE_BASE: ./

      - name: Backend syntax check
        run: node --check backend/src/index.js

      - name: Owned inspection workflow tests
        run: node --test "Damage AI Inspection/test/*.test.mjs"

      - name: Backend tests
        run: npm test --workspace=backend

      - name: Host app lint and tests
        run: |
          npm run lint --workspace=apps/host-mobile
          npm test --workspace=apps/host-mobile

      - name: Host Android bundle
        run: npm run build:android:bundle --workspace=apps/host-mobile

  inspection-integration:
    name: Owned inspections · PostgreSQL and HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inspection_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inspection_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/inspection_test
      INSPECTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inspection_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend and test dependencies
        run: npm ci --workspace=backend --include-workspace-root --ignore-scripts
      - name: Initialize isolated test schema
        run: npx prisma db push --schema=backend/prisma/schema.prisma
      - name: Inspect decoding and workflow rules
        run: node --test "Damage AI Inspection/test/*.test.mjs"
      - name: Validate deployment migration
        run: node "Damage AI Inspection/test/migration.integration.mjs"
      - name: Validate PostgreSQL transactions and payout holds
        run: node "Damage AI Inspection/test/database.integration.mjs"
      - name: Validate JWT authorization, MFA and private evidence routes
        run: node "Damage AI Inspection/test/http.integration.mjs"
